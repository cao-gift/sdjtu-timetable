<!doctype html><meta charset="utf-8"><title>教室课表</title>
<form action="result" method="post" target="roomResults">
  <label>学年学期<select name="xnxqh"><option>2026-2027-1</option></select></label>
  <label>校区<select name="xqbh" onchange="this.form.jxlbh.options[0].textContent=this.value==='south'?'南区教学楼':'北区教学楼'"><option value="north">北区</option><option value="south">南区</option></select></label>
  <label>所在教学楼<select name="jxlbh"><option value="building">北区教学楼</option></select></label>
  <label>教室<input name="jsmc" type="text"></label>
  <label>起始周次<select name="zc"><option value="">全部</option><option value="1">第1周</option><option value="2">第2周</option></select></label>
  <label>结束周次<select name="zc2"><option value="">全部</option><option value="1">第1周</option><option value="2">第2周</option></select></label>
  <label>星期<select name="xq"><option value="2">星期二</option></select></label>
  <label>节次<select name="jc"><option value="">全部</option></select></label>
  <input type="hidden" name="queryMode" value="fixture">
  <button type="submit">查询</button>
</form>
<iframe name="roomResults" title="查询结果"></iframe>
