<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>更新日志 · 驴驴课表</title>
  <meta name="description" content="驴驴课表完整版本更新记录（同步自 CHANGELOG.md）。" />
  <link rel="icon" type="image/png" href="./icon.png" />
  <style>
    :root {
      --bg: #EEECE8;
      --surface: rgba(255, 255, 255, 0.78);
      --surface-strong: rgba(255, 255, 255, 0.94);
      --border: rgba(27, 27, 31, 0.09);
      --border-strong: rgba(27, 27, 31, 0.18);
      --glass-edge: rgba(255, 255, 255, 0.85);
      --ink: #1B1B1F;
      --ink-2: #555450;
      --ink-3: #87857E;
      --on-ink: #FBFAF7;
      --accent: #FF4A1C;
      --chip: rgba(27, 27, 31, 0.055);
      --shadow-sm: 0 1px 2px rgba(27, 27, 31, 0.04), 0 6px 20px rgba(27, 27, 31, 0.045);
      --glow-1: rgba(217, 198, 178, 0.56);
      --glow-2: rgba(195, 205, 214, 0.52);
      --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
      --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Noto Sans SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0E0E0D;
        --surface: rgba(26, 26, 24, 0.82);
        --surface-strong: rgba(34, 34, 31, 0.95);
        --border: rgba(242, 240, 234, 0.09);
        --border-strong: rgba(242, 240, 234, 0.18);
        --glass-edge: rgba(242, 240, 234, 0.08);
        --ink: #F2F0EA;
        --ink-2: #B3B1AA;
        --ink-3: #7D7B75;
        --on-ink: #111110;
        --accent: #FF5A2E;
        --chip: rgba(242, 240, 234, 0.075);
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.28), 0 8px 24px rgba(0, 0, 0, 0.24);
        --glow-1: rgba(128, 102, 78, 0.2);
        --glow-2: rgba(84, 106, 128, 0.2);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0E0E0D;
      --surface: rgba(26, 26, 24, 0.82);
      --surface-strong: rgba(34, 34, 31, 0.95);
      --border: rgba(242, 240, 234, 0.09);
      --border-strong: rgba(242, 240, 234, 0.18);
      --glass-edge: rgba(242, 240, 234, 0.08);
      --ink: #F2F0EA;
      --ink-2: #B3B1AA;
      --ink-3: #7D7B75;
      --on-ink: #111110;
      --accent: #FF5A2E;
      --chip: rgba(242, 240, 234, 0.075);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.28), 0 8px 24px rgba(0, 0, 0, 0.24);
      --glow-1: rgba(128, 102, 78, 0.2);
      --glow-2: rgba(84, 106, 128, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: var(--sans); line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    .ambient {
      position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden;
    }
    .ambient::before {
      content: ""; position: absolute; width: 560px; height: 560px; top: -180px; right: -120px;
      border-radius: 50%; filter: blur(96px);
      background: radial-gradient(circle, var(--glow-2) 0%, var(--glow-1) 55%, transparent 75%);
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .container { max-width: 860px; margin: 0 auto; padding: 0 24px; }

    .topbar {
      position: sticky; top: 0; z-index: 40;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 76%, transparent);
      backdrop-filter: blur(20px) saturate(1.3);
      -webkit-backdrop-filter: blur(20px) saturate(1.3);
    }
    .topbar-inner {
      max-width: 1120px; margin: 0 auto; padding: 0 24px; height: 64px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
    .brand img { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--border); object-fit: cover; }
    .nav-links { display: flex; gap: 4px; }
    .nav-links a { padding: 7px 13px; border-radius: 999px; font-size: 14px; color: var(--ink-2); font-weight: 500; }
    .nav-links a:hover, .nav-links a.active { background: var(--chip); color: var(--ink); font-weight: 600; }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--surface); border: 1px solid var(--border); color: var(--ink-2);
    }
    .icon-btn:hover { border-color: var(--border-strong); color: var(--ink); }
    .btn-sm {
      height: 36px; padding: 0 16px; border-radius: 999px;
      display: inline-flex; align-items: center; font-size: 13.5px; font-weight: 600;
      background: var(--ink); color: var(--on-ink); white-space: nowrap;
    }
    @media (max-width: 680px) { .nav-links { display: none; } }

    .hero { padding: 48px 0 28px; }
    .eyebrow { font-size: 11.5px; letter-spacing: 0.09em; color: var(--ink-3); text-transform: uppercase; font-weight: 600; }
    .page-title { font-size: clamp(32px, 5vw, 46px); font-weight: 800; letter-spacing: -0.03em; margin-top: 8px; line-height: 1.15; }
    .page-sub { font-size: 13px; color: var(--ink-3); margin-top: 10px; }

    .list-wrap { padding-bottom: 72px; }
    .release {
      background: var(--surface); border: 1px solid var(--border);
      box-shadow: inset 0 1px 0 var(--glass-edge), var(--shadow-sm);
      backdrop-filter: blur(16px);
      border-radius: 20px; padding: 24px 26px; margin-bottom: 16px;
    }
    .release.is-latest { border-color: var(--border-strong); background: var(--surface-strong); }
    .rel-head {
      display: flex; align-items: baseline; justify-content: space-between;
      flex-wrap: wrap; gap: 6px 12px;
      padding-bottom: 14px; border-bottom: 1px solid var(--border);
    }
    .rel-ver { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .rel-latest {
      display: inline-block; vertical-align: 3px; margin-left: 10px;
      padding: 2px 9px; border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
    }
    .rel-date { font-size: 12.5px; color: var(--ink-3); }
    .rel-heading {
      font-size: 11.5px; letter-spacing: 0.08em; color: var(--ink-3);
      margin: 16px 0 6px; font-weight: 700; text-transform: uppercase;
    }
    .rel-list { margin: 10px 0 0; padding-left: 20px; color: var(--ink-2); font-size: 14.5px; overflow-wrap: anywhere; }
    .rel-list li { margin: 6px 0; }
    .rel-list code {
      font-family: var(--mono); font-size: 12.5px; color: var(--ink);
      background: var(--chip); border-radius: 6px; padding: 1px 6px; overflow-wrap: anywhere;
    }
    .empty { color: var(--ink-3); font-size: 13.5px; padding: 28px 0; }

    .foot {
      border-top: 1px solid var(--border);
      padding: 24px; text-align: center; font-size: 13px; color: var(--ink-3);
    }
    .foot a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
    @media (max-width: 520px) {
      .container, .topbar-inner { padding: 0 16px; }
      .release { padding: 18px; border-radius: 16px; }
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./index.html">
        <img src="./icon.png" alt="驴驴课表图标" width="32" height="32" />
        <span>驴驴课表</span>
      </a>
      <nav class="nav-links" aria-label="导航">
        <a href="./index.html">首页</a>
        <a class="active" href="./changelog.html">更新日志</a>
        <a href="./privacy.html">隐私声明</a>
      </nav>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeBtn" type="button" aria-label="切换浅色或深色主题">
          <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
        </button>
        <a class="btn-sm" href="./index.html#download">下载</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="eyebrow mono">CHANGELOG · 版本演进记录</div>
      <h1 class="page-title">更新日志</h1>
      <p class="page-sub mono" id="summary">同步自仓库 CHANGELOG.md</p>
    </section>

    <section class="list-wrap" id="list"><div class="empty mono">正在读取版本记录…</div></section>
  </main>

  <footer class="foot">
    <a href="./index.html">返回首页</a> · <a href="./privacy.html">隐私声明</a> · <a href="https://github.com/cao-gift/sdjtu-timetable/releases" target="_blank" rel="noopener">GitHub Releases</a>
  </footer>

  <script>
    (function () {
      const root = document.documentElement;
      const saved = localStorage.getItem("lvlv_theme");
      if (saved === "light" || saved === "dark") root.dataset.theme = saved;
      function isDarkNow() {
        return root.dataset.theme === "dark" ||
          (!root.dataset.theme && window.matchMedia("(prefers-color-scheme: dark)").matches);
      }
      function updateIcon() {
        document.getElementById("themeIcon").innerHTML = isDarkNow()
          ? '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>'
          : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
      }
      updateIcon();
      document.getElementById("themeBtn").addEventListener("click", function () {
        const next = isDarkNow() ? "light" : "dark";
        root.dataset.theme = next;
        localStorage.setItem("lvlv_theme", next);
        updateIcon();
      });

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      function formatInline(s) {
        return escapeHtml(s).replace(/`([^`]+)`/g, "<code>$1</code>");
      }

      fetch("./changelog.json?t=" + Date.now(), { cache: "no-store" })
        .then((r) => (r.ok ? r.json() : null))
        .then((data) => {
          const box = document.getElementById("list");
          if (!data || !Array.isArray(data.releases) || !data.releases.length) {
            box.innerHTML = '<div class="empty mono">暂时无法读取 changelog.json。</div>';
            return;
          }
          document.getElementById("summary").textContent =
            "CHANGELOG · v1.5.0 起共 " + data.releases.length + " 个版本";
          box.innerHTML = data.releases.map((rel, idx) => {
            let body = "";
            let openUl = false;
            for (const it of rel.items || []) {
              if (it.type === "heading") {
                if (openUl) { body += "</ul>"; openUl = false; }
                body += '<div class="rel-heading mono">' + escapeHtml(it.text) + "</div>";
              } else {
                if (!openUl) { body += '<ul class="rel-list">'; openUl = true; }
                body += "<li>" + formatInline(it.text) + "</li>";
              }
            }
            if (openUl) body += "</ul>";
            const badge = idx === 0 ? '<span class="rel-latest mono">LATEST</span>' : "";
            return '<article class="release' + (idx === 0 ? " is-latest" : "") + '">'
              + '<div class="rel-head">'
              + '<div class="rel-ver mono">v' + escapeHtml(rel.version) + badge + "</div>"
              + '<div class="rel-date mono">' + escapeHtml(rel.date || "") + "</div>"
              + "</div>" + body + "</article>";
          }).join("");
        })
        .catch(() => {
          document.getElementById("list").innerHTML =
            '<div class="empty mono">读取更新日志失败，请稍后刷新。</div>';
        });
    })();
  </script>
</body>
</html>
