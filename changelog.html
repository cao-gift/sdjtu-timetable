<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>更新日志 · 驴驴课表</title>
  <meta name="description" content="驴驴课表完整版本更新记录（同步自 CHANGELOG.md）。" />
  <link rel="icon" type="image/png" href="./icon.png" />
  <style>
    :root {
      --paper: #F5F4F0;
      --card: #FBFAF7;
      --ink: #111111;
      --sub: #55554F;
      --mute: #9A9993;
      --line: #E9E7E1;
      --accent: #FF4A1C;
      --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
      --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #0E0E0D;
        --card: #171716;
        --ink: #ECEAE4;
        --sub: #B3B1AA;
        --mute: #7C7B75;
        --line: #2A2A27;
        --accent: #FF5A2E;
      }
    }
    :root[data-theme="dark"] {
      --paper: #0E0E0D;
      --card: #171716;
      --ink: #ECEAE4;
      --sub: #B3B1AA;
      --mute: #7C7B75;
      --line: #2A2A27;
      --accent: #FF5A2E;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 780px; margin: 0 auto; padding: 20px 18px 64px; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--line);
    }
    .back-link {
      font-family: var(--mono); font-size: 12.5px; color: var(--sub);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .back-link:hover { color: var(--ink); }
    .ghost-btn {
      appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--sub);
      border-radius: 6px; padding: 0 12px; height: 34px; font-family: var(--mono);
      font-size: 11px; letter-spacing: 0.06em; cursor: pointer;
    }
    .ghost-btn:hover { border-color: var(--ink); color: var(--ink); }
    .page-title { font-size: 26px; font-weight: 700; margin: 22px 0 4px; }
    .page-sub { font-family: var(--mono); font-size: 12px; color: var(--mute); margin: 0 0 22px; }
    .release {
      background: var(--card); border: 1px solid var(--line); border-radius: 8px;
      padding: 18px 20px; margin-bottom: 14px;
    }
    .rel-head {
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
      padding-bottom: 10px; border-bottom: 1px solid var(--line);
    }
    .rel-ver {
      font-family: var(--mono); font-variant-numeric: tabular-nums;
      font-size: 20px; font-weight: 700;
    }
    .rel-latest { color: var(--accent); font-size: 11px; margin-left: 8px; letter-spacing: 0.06em; }
    .rel-date { font-family: var(--mono); font-size: 12px; color: var(--mute); }
    .rel-heading {
      font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.06em;
      color: var(--mute); margin: 12px 0 4px; font-weight: 700;
    }
    .rel-list { margin: 10px 0 0; padding-left: 18px; color: var(--sub); font-size: 14px; }
    .rel-list li { margin: 5px 0; }
    .rel-list code {
      font-family: var(--mono); font-size: 12.5px; color: var(--ink);
      background: var(--paper); border: 1px solid var(--line); border-radius: 4px;
      padding: 0 5px;
    }
    .empty { color: var(--mute); font-family: var(--mono); font-size: 13px; padding: 24px 0; }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <a class="back-link" href="./index.html">‹ 返回首页 · 驴驴课表</a>
      <button class="ghost-btn" id="themeBtn" type="button">THEME</button>
    </header>

    <h1 class="page-title">更新日志</h1>
    <p class="page-sub" id="summary">CHANGELOG · 读取自仓库 CHANGELOG.md</p>

    <section id="list"><div class="empty">正在读取版本记录…</div></section>
  </main>

  <script>
    (function () {
      const root = document.documentElement;
      const saved = localStorage.getItem("lvlv_theme");
      if (saved === "light" || saved === "dark") root.dataset.theme = saved;
      document.getElementById("themeBtn").addEventListener("click", function () {
        const isDark = root.dataset.theme === "dark" ||
          (!root.dataset.theme && window.matchMedia("(prefers-color-scheme: dark)").matches);
        const next = isDark ? "light" : "dark";
        root.dataset.theme = next;
        localStorage.setItem("lvlv_theme", next);
      });

      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      function formatInline(s) {
        return escapeHtml(s).replace(/`([^`]+)`/g, "<code>$1</code>");
      }

      fetch("./changelog.json?t=" + Date.now(), { cache: "no-store" })
        .then((r) => (r.ok ? r.json() : null))
        .then((data) => {
          const box = document.getElementById("list");
          if (!data || !Array.isArray(data.releases) || !data.releases.length) {
            box.innerHTML = '<div class="empty">暂时无法读取 changelog.json。</div>';
            return;
          }
          document.getElementById("summary").textContent =
            "CHANGELOG · v1.5.0 起共 " + data.releases.length + " 个版本";
          box.innerHTML = data.releases.map((rel, idx) => {
            let body = "";
            let openUl = false;
            for (const it of rel.items || []) {
              if (it.type === "heading") {
                if (openUl) { body += "</ul>"; openUl = false; }
                body += '<div class="rel-heading">' + escapeHtml(it.text) + "</div>";
              } else {
                if (!openUl) { body += '<ul class="rel-list">'; openUl = true; }
                body += "<li>" + formatInline(it.text) + "</li>";
              }
            }
            if (openUl) body += "</ul>";
            const badge = idx === 0 ? '<span class="rel-latest">● LATEST</span>' : "";
            return '<article class="release">'
              + '<div class="rel-head">'
              + '<div class="rel-ver">v' + escapeHtml(rel.version) + badge + "</div>"
              + '<div class="rel-date">' + escapeHtml(rel.date || "") + "</div>"
              + "</div>" + body + "</article>";
          }).join("");
        })
        .catch(() => {
          document.getElementById("list").innerHTML =
            '<div class="empty">读取更新日志失败，请稍后刷新。</div>';
        });
    })();
  </script>
</body>
</html>
